name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Opt into Node.js 24 now — avoids the forced migration breaking CI on June 2, 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Lint (active from M1)
  # ---------------------------------------------------------------------------
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.10"
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8
        run: |
          # Lint all Python service directories
          flake8 services/ --max-line-length=100 --exclude=__pycache__,venv,.venv \
            --count --statistics
        continue-on-error: true   # Warnings only until M3 — change to false when code lands

  lint-js:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
      - name: Install and run ESLint (dashboard)
        working-directory: services/dashboard/frontend
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run lint
          else
            echo "No package.json yet — skipping JS lint (M9 deliverable)"
          fi

  # ---------------------------------------------------------------------------
  # Stage 2: Docker build check (active from M1)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Validate docker-compose syntax
        run: docker compose config --quiet
      - name: Build services (infrastructure only for now)
        run: |
          echo "Docker build check — full service builds activate per milestone"
          docker compose config --quiet && echo "docker-compose.yml is valid ✓"

  # ---------------------------------------------------------------------------
  # Stage 3: Python tests (activates M3 — stub only)
  # ---------------------------------------------------------------------------
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: [lint-python]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.10"
      - name: Run tests
        run: |
          if find services/ -name "test_*.py" | grep -q .; then
            pip install pytest
            pytest services/ -v
          else
            echo "No tests yet — test suite activates in M3 ✓"
          fi

