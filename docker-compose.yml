version: "3.9"

# =============================================================================
# DataForge — Full Stack Docker Compose
# All 10 modules + supporting infrastructure
#
# Bringing up services: either (a) name every service explicitly — Compose starts
# named services regardless of their `profiles:` tag, or (b) use `docker compose up`
# with no service names, in which case you must stack every applicable --profile
# flag (they don't cascade — "m5-and-above" does NOT imply "m3-and-above" is also
# active). Full current-stack example:
#   docker compose --profile m3-and-above --profile m4-and-above --profile m5-and-above up --build
# =============================================================================

networks:
  dataforge-net:
    driver: bridge

volumes:
  timescaledb-data:
  kafka-data:

services:

  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE
  # ---------------------------------------------------------------------------

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: dataforge-kafka
    networks: [dataforge-net]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "tZ0EOM6NQomKP3ihd1RcPQ"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: dataforge-kafka-ui
    networks: [dataforge-net]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: dataforge
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: dataforge-timescaledb
    networks: [dataforge-net]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dataforge}
      POSTGRES_USER: ${POSTGRES_USER:-dataforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dataforge_dev}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dataforge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: dataforge-adminer
    networks: [dataforge-net]
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: timescaledb

  # ---------------------------------------------------------------------------
  # MODULE 1 — ALICE-like Event Data Ingestion
  # ---------------------------------------------------------------------------

  alice-ingestion:
    build:
      context: ./services/data-sources/alice-ingestion
      dockerfile: ../../../infrastructure/docker/alice-ingestion.Dockerfile
    container_name: dataforge-alice-ingestion
    networks: [dataforge-net]
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_ALICE: alice-events
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-dataforge}
      DB_USER: ${POSTGRES_USER:-dataforge}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dataforge_dev}
      ALICE_REPLAY_INTERVAL_MS: 500
    volumes:
      - ./schemas:/app/schemas
    profiles: ["m5-and-above"]

  # ---------------------------------------------------------------------------
  # MODULE 2 — Synthetic Sensor Data Generators
  # ---------------------------------------------------------------------------

  sensor-generators:
    build:
      context: ./services/data-sources/sensor-generators
      dockerfile: ../../../infrastructure/docker/sensor-generators.Dockerfile
    container_name: dataforge-sensor-generators
    networks: [dataforge-net]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_RADAR: sensor-radar
      KAFKA_TOPIC_LIDAR: sensor-lidar
      KAFKA_TOPIC_TELEMETRY: sensor-telemetry
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-100}
      SENSOR_PUBLISH_INTERVAL_MS: ${SENSOR_PUBLISH_INTERVAL_MS:-200}
    volumes:
      - ./schemas:/app/schemas
    profiles: ["m3-and-above"]

  # ---------------------------------------------------------------------------
  # MODULE 3 — Data Adaptation Layer
  # ---------------------------------------------------------------------------

  adaptation-layer:
    build:
      context: ./services/adaptation-layer
      dockerfile: ../../infrastructure/docker/adaptation-layer.Dockerfile
    container_name: dataforge-adaptation
    networks: [dataforge-net]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-dataforge}
      DB_USER: ${POSTGRES_USER:-dataforge}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dataforge_dev}
    volumes:
      - ./schemas:/app/schemas
      - ./data:/app/data
    profiles: ["m4-and-above"]

  # ---------------------------------------------------------------------------
  # MODULE 4+5 — Streaming + Cleaning & Sync (PySpark)
  # ---------------------------------------------------------------------------

  spark-processor:
    build:
      context: ./services/streaming/spark
      dockerfile: ../../../infrastructure/docker/spark.Dockerfile
    container_name: dataforge-spark
    networks: [dataforge-net]
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_ALICE: alice-events
      KAFKA_TOPIC_RADAR: sensor-radar
      KAFKA_TOPIC_LIDAR: sensor-lidar
      KAFKA_TOPIC_TELEMETRY: sensor-telemetry
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-dataforge}
      DB_USER: ${POSTGRES_USER:-dataforge}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dataforge_dev}
      WATERMARK_DELAY_SECONDS: ${WATERMARK_DELAY_SECONDS:-5}
      SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-8}
      SPARK_MAX_OFFSETS_PER_TRIGGER: ${SPARK_MAX_OFFSETS_PER_TRIGGER:-50000}
      SPARK_STARTING_TIMESTAMP_MS: ${SPARK_STARTING_TIMESTAMP_MS:-}
    volumes:
      - ./schemas:/app/schemas
      # M5W18T9: reuses the adaptation layer's schema_versioning.py rather
      # than duplicating it into this build context — single source of
      # truth for version-drift + round-trip enforcement (read-only mount).
      - ./services/adaptation-layer/schema_versioning.py:/app/src/schema_versioning.py:ro
    profiles: ["m5-and-above"]

  # ---------------------------------------------------------------------------
  # MODULE 6 — Data Fusion
  # ---------------------------------------------------------------------------

  fusion-engine:
    build:
      context: ./services/fusion
      dockerfile: ../infrastructure/docker/fusion.Dockerfile
    container_name: dataforge-fusion
    networks: [dataforge-net]
    depends_on:
      spark-processor:
        condition: service_started
    profiles: ["m6-and-above"]

  # ---------------------------------------------------------------------------
  # MODULE 7 — AI/ML Anomaly Detection
  # ---------------------------------------------------------------------------

  anomaly-detection:
    build:
      context: ./services/ai-ml/anomaly-detection
      dockerfile: ../../infrastructure/docker/anomaly-detection.Dockerfile
    container_name: dataforge-anomaly-detection
    networks: [dataforge-net]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      MODEL_PATH: /models/anomaly_model.pkl
      DB_HOST: timescaledb
      DB_USER: ${POSTGRES_USER:-dataforge}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dataforge_dev}
    profiles: ["m7-and-above"]

  # ---------------------------------------------------------------------------
  # MODULE 8 — Explainable AI (XAI / SHAP)
  # ---------------------------------------------------------------------------

  xai-service:
    build:
      context: ./services/ai-ml/xai
      dockerfile: ../../infrastructure/docker/xai.Dockerfile
    container_name: dataforge-xai
    networks: [dataforge-net]
    depends_on:
      anomaly-detection:
        condition: service_started
    profiles: ["m8-and-above"]

  # ---------------------------------------------------------------------------
  # MODULE 9b — FastAPI Backend
  # ---------------------------------------------------------------------------

  api:
    build:
      context: ./services/dashboard/backend
      dockerfile: ../../infrastructure/docker/api.Dockerfile
    container_name: dataforge-api
    networks: [dataforge-net]
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dataforge}:${POSTGRES_PASSWORD:-dataforge_dev}@timescaledb:5432/${POSTGRES_DB:-dataforge}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      API_SECRET_KEY: ${API_SECRET_KEY:-dev-secret-key-change-in-production}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: ["m9-and-above"]

  # ---------------------------------------------------------------------------
  # MODULE 9a — ReactJS Dashboard
  # ---------------------------------------------------------------------------

  dashboard:
    build:
      context: ./services/dashboard/frontend
      dockerfile: ../../infrastructure/docker/dashboard.Dockerfile
    container_name: dataforge-dashboard
    networks: [dataforge-net]
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      REACT_APP_API_URL: http://localhost:8000
    profiles: ["m9-and-above"]